<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matriz de Alma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --line:#a80000;
    --line-bright:#ff1414;
    --white:#f5f5f5;
    --gold:#ffd23f;
    --purple:#b16cff;
    --cyan:#3be8ff;
    --orange:#ff8c1a;
    --blue:#2b3bff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    color:var(--white);
    font-family:'VT323', monospace;
    min-height:100vh;
    overflow-x:hidden;
  }
  .hidden{display:none !important;}
  .pixel{font-family:'Press Start 2P', monospace;}

  /* ---------- NAME SCREEN ---------- */
  #name-screen{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:#000;
    z-index:100;
    padding:1.5rem;
  }
  .name-box{
    width:100%;max-width:520px;
    border:4px solid var(--white);
    background:#000;
    padding:2.2rem 1.8rem;
    text-align:center;
    box-shadow: 0 0 0 3px #000, 0 0 26px rgba(255,255,255,.08);
  }
  .soul-mark{
    width:22px;height:20px;
    margin:0 auto 1.4rem;
    background:var(--line-bright);
    clip-path: path('M11 20 C11 20 0 12 0 5.5 C0 1.5 4 0 6 1.5 C8 3 11 6 11 6 C11 6 14 3 16 1.5 C18 0 22 1.5 22 5.5 C22 12 11 20 11 20 Z');
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);opacity:1;}
    50%{transform:scale(1.15);opacity:.75;}
  }
  .name-box p{
    font-size:1.05rem;
    line-height:1.7;
    margin:0 0 1.6rem;
  }
  .name-box .prompt-tag{
    font-size:.62rem;
    color:var(--line-bright);
    display:block;
    margin-bottom:.9rem;
    letter-spacing:1px;
  }
  #name-input{
    width:100%;
    background:#000;
    border:3px solid var(--white);
    color:var(--white);
    font-family:'VT323', monospace;
    font-size:1.4rem;
    padding:.55rem .7rem;
    text-align:center;
    caret-color:var(--line-bright);
    outline:none;
    margin-bottom:1.6rem;
  }
  #name-input:focus{border-color:var(--line-bright);}
  .btn-undertale{
    background:#000;
    border:3px solid var(--white);
    color:var(--white);
    font-family:'Press Start 2P', monospace;
    font-size:.72rem;
    padding:.8rem 1.4rem;
    cursor:pointer;
    position:relative;
    letter-spacing:1px;
  }
  .btn-undertale::before{
    content:"";
    position:absolute;
    left:-1.1rem; top:50%;
    transform:translateY(-50%);
    width:0;height:0;
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
    border-left:9px solid var(--line-bright);
    opacity:0;
    transition:opacity .15s;
  }
  .btn-undertale:hover::before,
  .btn-undertale:focus::before{opacity:1;}
  .btn-undertale:hover,.btn-undertale:focus{border-color:var(--line-bright);}
  .warn-msg{
    font-size:.85rem;
    color:var(--line-bright);
    min-height:1.2rem;
    margin-top:-1rem;
    margin-bottom:1rem;
  }
  .shake{animation:shake .35s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }

  /* ---------- MAIN SCREEN ---------- */
  #main-screen{
    max-width:900px;
    margin:0 auto;
    padding:3rem 1.2rem 5rem;
    text-align:center;
    opacity:0;
    transition:opacity .8s ease;
  }
  #main-screen.show{opacity:1;}
  #main-title{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(1rem, 3vw, 1.5rem);
    color:var(--white);
    margin:0 0 .8rem;
    line-height:1.6;
  }
  #main-title span{color:var(--line-bright);}
  #main-sub{
    font-size:1.15rem;
    color:#bdbdbd;
    max-width:520px;
    margin:0 auto 2.8rem;
    line-height:1.5;
  }

  /* ---------- DIAGRAM ---------- */
  .diagram-wrap{
    width:min(640px, 92vw);
    aspect-ratio:1/1;
    margin:0 auto;
    position:relative;
  }
  .soul-image{
    width:100%;
    height:100%;
    display:block;
    -webkit-user-drag:none;
    user-select:none;
    pointer-events:none;
  }
  .hotspot{
    position:absolute;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:transparent;
    border:none;
    padding:0;
    cursor:pointer;
    box-shadow:0 0 0 0 rgba(255,20,20,0);
    transition:box-shadow .18s ease, background .18s ease;
  }
  .hotspot:hover, .hotspot:focus{
    background:rgba(255,20,20,.12);
    box-shadow:0 0 0 4px rgba(255,20,20,.55);
    outline:none;
  }

  /* ---------- MODAL ---------- */
  #modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.82);
    display:flex;align-items:center;justify-content:center;
    z-index:200;
    padding:1.2rem;
  }
  .modal-box{
    width:100%;max-width:460px;
    background:#000;
    border:4px solid var(--white);
    box-shadow:0 0 0 3px #000, 0 0 28px rgba(255,255,255,.08);
    padding:1.8rem 1.6rem 1.6rem;
    position:relative;
    text-align:left;
  }
  .modal-close{
    position:absolute; top:.6rem; right:.7rem;
    background:none;border:2px solid var(--white);
    color:var(--white);
    font-family:'Press Start 2P', monospace;
    font-size:.7rem;
    width:1.9rem;height:1.9rem;
    line-height:1;
    cursor:pointer;
  }
  .modal-close:hover{border-color:var(--line-bright); color:var(--line-bright);}
  .modal-icon{
    width:76px;height:76px;
    margin:0 auto 1rem;
    border-radius:50%;
    overflow:hidden;
  }
  .modal-icon svg, .modal-icon img{width:100%;height:100%;display:block;object-fit:cover;}
  .modal-title{
    font-family:'Press Start 2P', monospace;
    font-size:1rem;
    text-align:center;
    margin:0 0 .3rem;
    color:var(--modal-color, var(--line-bright));
  }
  .modal-tag{
    text-align:center;
    font-size:.85rem;
    letter-spacing:1px;
    color:#999;
    margin:0 0 1.2rem;
    font-family:'Press Start 2P', monospace;
  }
  .modal-body{
    font-size:1.2rem;
    line-height:1.55;
    color:#e6e6e6;
    border-top:2px solid #262626;
    padding-top:1rem;
    max-height:60vh;
    overflow-y:auto;
  }
  .modal-body p{margin:0 0 .9rem;}
  .modal-body p:last-child{margin-bottom:0;}
  .info-section{margin-top:1.1rem;padding-top:1.1rem;border-top:2px solid #262626;}
  .info-section:first-child{margin-top:0;padding-top:0;border-top:none;}
  .info-section h3{
    font-family:'Press Start 2P', monospace;
    font-size:.72rem;
    color:var(--line-bright);
    margin:0 0 .6rem;
    letter-spacing:.5px;
  }
  .path-block{margin-top:1.2rem;}
  .path-heading{
    font-family:'Press Start 2P', monospace;
    font-size:.72rem;
    color:var(--line-bright);
    display:flex;
    align-items:center;
    gap:.6rem;
    margin:0 0 .6rem;
    letter-spacing:.5px;
  }
  .path-heading .arrow{
    display:inline-block;
    width:0;height:0;
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
    border-left:9px solid var(--line-bright);
    flex-shrink:0;
  }

  footer{
    text-align:center;
    color:#555;
    font-size:.9rem;
    padding-bottom:2rem;
  }
</style>
</head>
<body>

<audio id="bg-music" src="trilha.mp3" loop preload="auto" style="display:none;"></audio>

<!-- ===== NAME SCREEN ===== -->
<div id="name-screen">
  <div class="name-box">
    <div class="soul-mark"></div>
    <span class="prompt-tag">* MATRIZ DE ALMA</span>
    <p>Antes de prosseguir...<br>como devo chamar o portador desta alma?</p>
    <input id="name-input" type="text" maxlength="20" autocomplete="off" placeholder="digite um nome">
    <div class="warn-msg" id="warn-msg"></div>
    <button class="btn-undertale" id="confirm-btn">CONFIRMAR</button>
  </div>
</div>

<div id="main-screen">

    body: '<div class="info-section"><h3>Matriz de Alma</h3><p>É a forma pura e fundamental da energia espiritual. Representa o estado primário em que a mana é manipulada (seja comprimindo-a no corpo, projetando-a para fora ou impondo limites e regras a ela), servindo como os pilares base de toda alma.</p></div><div class="info-section"><h3>Harmonia</h3><p>É a fusão equilibrada entre duas matrizes diferentes. Ocorre quando o usuário combina os princípios de duas matrizes simultaneamente, criando uma aplicação mais complexa, especializada e versátil da sua Mana.</p></div><div class="info-section"><h3>Potencial Inato</h3><p>É a manifestação única, pessoal e conceitual do poder de cada indivíduo, a "assinatura" da sua alma. Enquanto as matrizes e harmonias representam a base teórica e técnica da mana, o Potencial Inato é a habilidade especial e exclusiva que o personagem desenvolve para moldar esse sistema à sua própria identidade.</p></div>' },

    body: '<p>A segunda fusão de Vigor com Fluxo.</p><p>O Vigor fortalece os órgãos sensoriais enquanto o Fluxo expande pequenos filamentos de mana ao redor. O usuário lê o ambiente com precisão absoluta, percebendo movimentos, intenções e presenças invisíveis.</p>' },

    body: '<p>A segunda fusão de Domínio com Fluxo.</p><p>A emissão livre do Fluxo é afunilada pelas formas estruturadas do Domínio.</p><div class="path-block"><div class="path-heading"><span class="arrow"></span>Materialização</div><p>O usuário usa a precisão geométrica do Domínio para moldar a aura de mana emitida pelo Fluxo em formas sólidas e inanimadas, criando armas translúcidas, afiadas e reluzentes na cor da alma do personagem, e ferramentas de combate feitas de energia pura.</p></div><div class="path-block"><div class="path-heading"><span class="arrow"></span>Criados de Alma</div><p>O usuário projeta uma porção de sua aura delimitada pelo Domínio e concede a ela uma forma viva e autônoma. O Fluxo dá vida e mobilidade à energia, enquanto o Domínio delimita a forma do criado e estabelece suas regras de comportamento (como "proteger o aliado", "atacar quem entrar no perímetro" ou "rastrear um alvo"). Os Criados de Alma podem agir de forma independente, sem exigir que o usuário controle cada movimento manualmente.</p><p>(Certas partes do controle dependem do domínio avançado da habilidade do personagem nessa harmonia, sendo essa a habilidade mais difícil de ser aprimorada.)</p></div>' },

const nameScreen = document.getElementById('name-screen');
const mainScreen = document.getElementById('main-screen');
const nameInput = document.getElementById('name-input');
const confirmBtn = document.getElementById('confirm-btn');
const warnMsg = document.getElementById('warn-msg');

function confirmName(){
  const val = nameInput.value.trim();
  if(!val){
    warnMsg.textContent = "* ...seu nome não pode ficar vazio.";
    nameInput.parentElement.classList.add('shake');
    setTimeout(()=>nameInput.parentElement.classList.remove('shake'),350);
    return;
  }
  document.getElementById('name-display').textContent = val.toUpperCase();
  document.getElementById('name-display-2').textContent = val;

  const music = document.getElementById('bg-music');
  music.volume = 0.4;
  music.play().catch(()=>{});

  nameScreen.style.transition = 'opacity .6s ease';
  nameScreen.style.opacity = '0';
  setTimeout(()=>{
    nameScreen.classList.add('hidden');
    mainScreen.classList.add('show');
  },600);
}
confirmBtn.addEventListener('click', confirmName);
nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') confirmName(); });
window.addEventListener('load', ()=>nameInput.focus());

/* modal */
const overlay = document.getElementById('modal-overlay');
const modalIcon = document.getElementById('modal-icon');
const modalTitle = document.getElementById('modal-title');
const modalTag = document.getElementById('modal-tag');
const modalBody = document.getElementById('modal-body');

function openModal(id){
  const p = POWERS[id];
  if(!p) return;
  modalIcon.innerHTML = p.icon;
  modalTitle.textContent = p.title;
  modalTitle.style.setProperty('--modal-color', p.color);
  modalTitle.style.color = p.color;
  modalTag.textContent = p.tag;
  modalBody.innerHTML = p.body;
  overlay.classList.remove('hidden');
}
function closeModal(){ overlay.classList.add('hidden'); }
document.getElementById('modal-close').addEventListener('click', closeModal);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

document.querySelectorAll('.hotspot').forEach(n=>{
  n.addEventListener('click', ()=>openModal(n.dataset.id));
});
</script>
